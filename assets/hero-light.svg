<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="Ziad Ali, CS student, systems and AI">
<defs>
<clipPath id="r"><rect width="900" height="320" rx="14"/></clipPath>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#818b98" fill-opacity="0.35"/></pattern>
<linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#d14a2f"/><stop offset="0.6" stop-color="#d14a2f" stop-opacity="0"/></linearGradient>
