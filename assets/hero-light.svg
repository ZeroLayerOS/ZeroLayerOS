<linearGradient id="nm" x1="0" x2="1"><stop offset="0" stop-color="#1f2328"/><stop offset="1" stop-color="#6f352b"/></linearGradient>
<linearGradient id="lg0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d6dbe1"/><stop offset="1" stop-color="#c4ccd4"/></linearGradient>
<linearGradient id="lg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d8c6c6"/><stop offset="1" stop-color="#c7aeae"/></linearGradient>
