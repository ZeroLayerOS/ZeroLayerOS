<style>
.ly{animation:drop .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes drop{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
.fl{animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-3px)}}
.bit{animation:rise 4.5s ease-in infinite;opacity:0}
@keyframes rise{0%{opacity:0;transform:translateY(14px)}30%{opacity:.85}100%{opacity:0;transform:translateY(-22px)}}
.cur{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.ly,.fl,.row,.cur,.pulse,.bit{animation:none!important}}
</style>
