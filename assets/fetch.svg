<svg width="760" height="360" viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glowF" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <mask id="f1"><rect width="0" height="360" fill="#fff"><animate attributeName="width" from="0" to="760" dur="0.35s" begin="0.15s" fill="freeze"/></rect></mask>
    <mask id="f2"><rect width="0" height="360" fill="#fff"><animate attributeName="width" from="0" to="760" dur="0.35s" begin="0.55s" fill="freeze"/></rect></mask>
    <mask id="f3"><rect width="0" height="360" fill="#fff"><animate attributeName="width" from="0" to="760" dur="0.35s" begin="0.85s" fill="freeze"/></rect></mask>
    <mask id="f4"><rect width="0" height="360" fill="#fff"><animate attributeName="width" from="0" to="760" dur="0.35s" begin="1.15s" fill="freeze"/></rect></mask>
    <mask id="f5"><rect width="0" height="360" fill="#fff"><animate attributeName="width" from="0" to="760" dur="0.35s" begin="1.45s" fill="freeze"/></rect></mask>
    <mask id="f6"><rect width="0" height="360" fill="#fff"><animate attributeName="width" from="0" to="760" dur="0.35s" begin="1.75s" fill="freeze"/></rect></mask>
    <mask id="f7"><rect width="0" height="360" fill="#fff"><animate attributeName="width" from="0" to="760" dur="0.35s" begin="2.05s" fill="freeze"/></rect></mask>
    <mask id="f8"><rect width="0" height="360" fill="#fff"><animate attributeName="width" from="0" to="760" dur="0.35s" begin="2.35s" fill="freeze"/></rect></mask>
    <mask id="f9"><rect width="0" height="360" fill="#fff"><animate attributeName="width" from="0" to="760" dur="0.35s" begin="2.65s" fill="freeze"/></rect></mask>

    <mask id="art"><rect width="0" height="360" fill="#fff"><animate attributeName="width" from="0" to="300" dur="0.6s" begin="0s" fill="freeze"/></rect></mask>
    <mask id="sw"><rect width="0" height="360" fill="#fff"><animate attributeName="width" from="0" to="760" dur="0.4s" begin="2.95s" fill="freeze"/></rect></mask>
  </defs>

  <rect width="760" height="360" rx="10" fill="#2a2422"/>
  <rect x="0" y="0" width="760" height="360" rx="10" fill="none" stroke="#c9c2b4" stroke-opacity="0.2" stroke-width="1.2"/>

  <rect width="760" height="34" rx="10" fill="#343d41"/>
  <rect y="24" width="760" height="10" fill="#343d41"/>
  <circle cx="22" cy="17" r="6" fill="#de6145"/>
  <circle cx="44" cy="17" r="6" fill="#c9c2b4"/>
  <circle cx="66" cy="17" r="6" fill="#d9dbdc"/>
  <text x="380" y="22" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#c9c2b4">
    ziad@zerolayeros: ~
  </text>

  <text x="380" y="58" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#c9c2b4" filter="url(#glowF)">
    root@ziad-ali:~$ fastfetch
  </text>

  <!-- ASCII layered-stack logo -->
  <g font-family="Consolas, monospace" font-size="17" font-weight="bold" mask="url(#art)">
    <text x="40"  y="100" fill="#de6145">██████████</text>
    <text x="52"  y="122" fill="#c9c2b4">████████</text>
    <text x="64"  y="144" fill="#d9dbdc">██████</text>
    <text x="76"  y="166" fill="#c9c2b4">████</text>
    <text x="88"  y="188" fill="#de6145">██</text>
    <text x="30"  y="216" fill="#c9c2b4" font-size="13" font-weight="normal">ZeroLayerOS</text>
  </g>

  <!-- Info lines -->
  <g font-family="Consolas, monospace" font-size="15">
    <text x="255" y="90"  mask="url(#f1)"><tspan fill="#de6145">OS</tspan><tspan fill="#d9dbdc">        ZeroLayerOS x86_64</tspan></text>
    <text x="255" y="114" mask="url(#f2)"><tspan fill="#de6145">Host</tspan><tspan fill="#d9dbdc">      github.com/ZeroLayerOS</tspan></text>
    <text x="255" y="138" mask="url(#f3)"><tspan fill="#de6145">User</tspan><tspan fill="#d9dbdc">      Ziad Ali</tspan></text>
    <text x="255" y="162" mask="url(#f4)"><tspan fill="#de6145">Role</tspan><tspan fill="#d9dbdc">      CS Student</tspan></text>
    <text x="255" y="186" mask="url(#f5)"><tspan fill="#de6145">Shell</tspan><tspan fill="#d9dbdc">     zsh</tspan></text>
    <text x="255" y="210" mask="url(#f6)"><tspan fill="#de6145">Editor</tspan><tspan fill="#d9dbdc">    neovim</tspan></text>
    <text x="255" y="234" mask="url(#f7)"><tspan fill="#de6145">Languages</tspan><tspan fill="#d9dbdc"> Rust, Python, C/C++</tspan></text>
    <text x="255" y="258" mask="url(#f8)"><tspan fill="#de6145">Focus</tspan><tspan fill="#d9dbdc">     ML · DL · DSA · Systems Programming</tspan></text>
    <text x="255" y="282" mask="url(#f9)"><tspan fill="#de6145">Status</tspan><tspan fill="#d9dbdc">    Learning &amp; Building</tspan></text>
  </g>

  <!-- color palette swatch row -->
  <g mask="url(#sw)">
    <rect x="255" y="305" width="26" height="18" rx="3" fill="#434c50"/>
    <rect x="285" y="305" width="26" height="18" rx="3" fill="#d9dbdc"/>
    <rect x="315" y="305" width="26" height="18" rx="3" fill="#d9dbdc"/>
    <rect x="345" y="305" width="26" height="18" rx="3" fill="#c9c2b4"/>
    <rect x="375" y="305" width="26" height="18" rx="3" fill="#c9c2b4"/>
    <rect x="405" y="305" width="26" height="18" rx="3" fill="#de6145"/>
    <rect x="435" y="305" width="26" height="18" rx="3" fill="#343d41"/>
    <rect x="465" y="305" width="26" height="18" rx="3" fill="#343d41"/>
  </g>

  <rect x="255" y="333" width="11" height="18" fill="#de6145">
    <animate attributeName="opacity" values="1;0;1" dur="1s" begin="3.3s" repeatCount="indefinite"/>
  </rect>
</svg>
