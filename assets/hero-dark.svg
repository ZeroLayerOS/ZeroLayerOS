<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="Ziad Ali, CS student, systems and AI">
<defs>
<clipPath id="r"><rect width="900" height="320" rx="14"/></clipPath>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#6e7681" fill-opacity="0.22"/></pattern>
